    - event.HLT_IsoMu27
    - event.HLT_Mu50
    - event.HLT_Ele35_WPTight_Gsf
    - event.HLT_Photon200

Triggers_HZZ2l2nu_GammaCR:
    # single-photon (gamma+jets) CR: HLT_Photon ladder, AN-15-208 Table 7 style. All but
    # HLT_Photon200 are PRESCALED in 2017 -> each event is used only through the path of its
    # photon-pT window (GammaCR.TriggerWindows) and data are weighted by the prescale.
    - event.HLT_Photon50_R9Id90_HE10_IsoM
    - event.HLT_Photon75_R9Id90_HE10_IsoM
    - event.HLT_Photon90_R9Id90_HE10_IsoM
    - event.HLT_Photon120_R9Id90_HE10_IsoM
    - event.HLT_Photon165_R9Id90_HE10_IsoM
    - event.HLT_Photon200

Zmass: 91.1876
MZ1cut: 40
MZcut:
    down:   12
    up: 120
MZZcut: 70
Higgscut:
    up: 160
    down: 105

Electron:
    pTcut: 25  #7
    Etacut: 2.5 #2.5
    #Sip3dcut: 4
    Loosedxycut: 0.045 #0.5 
    Loosedzcut: 0.2 #1 #0.2
    ttH:
        WP: 0.8
    BDTWP:
        LowEta:
            LowPT: 0.9044286167
            HighPT: 0.1968600840
        MedEta:
            LowPT: 0.9094166886
            HighPT: 0.0759172100
        HighEta:
            LowPT: 0.9443653660
            HighPT: -0.5169136775
    Isocut: 0.15 #0.35
    # Electron-muon cross-cleaning: drop electrons within dR < dR of a POG-loose muon
    # (PF candidate, global or tracker) with pT > MuPt. 0.05 = CMS H->ZZ->4l convention.
    # DISABLED for now (not in AN-2016/325; H4LTools::LeptonSelection, see docs/TODO.md).
    MuonCleaning:
        dR: 0.05
        MuPt: 5.0

Muon:
    pTcut: 25 #5

    Etacut: 2.4
    #Sip3dcut: 4
    Loosedxycut: 0.045 #0.5 #0.045
    Loosedzcut: 0.2 #1 #0.2
    Tightdxycut: 0.045 #0.2
    Tightdzcut: 0.2 #0.5
    TightTrackerLayercut: 5
    TightpTErrorcut: 0.3
    HighPtBound: 200
    Isocut: 0.2 #0.35

FsrPhoton:
    pTcut: 2
    Etacut: 2.4
    Isocut: 0.8
    dRlcut: 0.5
    dRlOverPtcut: 0.012

Jet:
    pTcut: 30
    Etacut: 4.7
    # UParTAK4 (Jet_btagUParTAK4B) WPs for UL NanoAODv15.
    # https://btv-wiki.docs.cern.ch/ScaleFactors/Run2UL2017NanoAODv15/#ak4-b-tagging
    # = UParTAK4_wp_values in /cvmfs/cms-griddata.cern.ch/cat/metadata/BTV/Run2-2017-UL-NanoAODv15/latest/btagging.json.gz
    UParTAK4_btag:
        Loose: 0.0331
        Medium: 0.1776
        Tight: 0.5755
        Etacut: 2.4   # b-tagging acceptance
    # jets within dR < LepCleanDR of a selected (tight, isolated) lepton are removed (AN-2016/325)
    LepCleanDR: 0.4

HZZ2l2q:
    Leading_Lep_pT: 40
    SubLeading_Lep_pT: 24
    Lep_eta: 2.4
    MZLepcut:
        down: 60
        up: 120

HZZ2l2nu:
    Leading_Lep_pT: 25.0
    SubLeading_Lep_pT: 25.0
    Lep_eta: 2.5
    Pt_ll: 10.0
    # Loose skim; the AN-2016/325 cuts (|m_ll - mZ| < 15, pT_ll > 55, b-veto, min dPhi(jet, MET) > 0.5,
    # |dPhi(Z, MET)| > 0.5, MET > 125) are applied downstream. The m_ll range is kept wide for the
    # AN alpha-method sidebands 40-70 and 110-200 GeV.
    M_ll_Window: 110.0  # |m_ll - mZ| < M_ll_Window
    dPhi_jetMET: 0.0
    # m_ll window of the ee / mumu Z1 candidates (instead of the 4l MZcut 12-120)
    MZLepcut:
        down: 12.0
        up: 200.0
    # AN-2016/325 4.3: the ee / mumu pair is not required to have opposite charge
    # (HZZ2l2qNu_cutOppositeChargeFlag is still stored). Shared with 2l2q under --channels all.
    RequireOS: false
    # AN-2016/325 4.3 VBF tag: two leading jets, |dEta_jj| > dEta_jj, m_jj > M_jj, the Z between the
    # two jets in eta (ZCentrality) and no other jet between them (CentralJetVeto).
    VBF:
        dEta_jj: 4.0
        M_jj: 500.0
        ZCentrality: true
        CentralJetVeto: true
    # Extra-lepton veto: events with a loose lepton beyond the Z1 / emu pair are rejected
    # in ZZSelection_2l2nu (count stored as HZZ2l2nu_nExtraLep).
    # AN-2016/325 4.4.4 values -- unverified for UL / NanoAOD v15.
    VetoLep:
        Ele_pT: 10.0
        # cut-based ID WP (Electron_cutBased, Fall17V2: 1 veto, 2 loose, 3 medium, 4 tight); AN = Loose
        Ele_cutBased: 2
        Ele_Iso: 0.15
        Mu_pT: 10.0
        Mu_Iso: 0.2
        # AN 4.4.4 soft-muon veto (soft ID, pT > SoftMu_pT; < 0: off). APPLIED in the skim: events with
        # HZZ2l2nu_nExtraSoftMu (AN definition) > 0 are rejected; _nExtraSoftMuPV (+ |dz| < 0.5, |dxy| < 0.2) stored only.
        SoftMu_pT: 3.0
    # emu control region: |m_emu - mZ| < M_ll_Window and pT_emu > Pt_ll
    emuCR:
        M_ll_Window: 160.0
        Pt_ll: 25.0

# single-photon (gamma+jets) control region, AN-15-208 4.2 "Photons" / 5.2 (--channels 1g).
# Exactly one photon passing: cut-based ID >= IDcut (3 = tight), barrel supercluster, electron veto,
# no pixel seed, pT > pTcut. Jets within JetCleanDR of the photon are removed. No loose lepton
# (HZZ2l2nu.VetoLep) allowed. The photon takes the Z role (Z1 = photon with m = mZ) in
# ZZSelection_2l2nu (jets, b-tags, VBF, mT).
GammaCR:
    pTcut: 55.0
    IDcut: 3
    JetCleanDR: 0.4
    # Exclusive photon-pT windows [ptMin, next ptMin): the event counts only if the window's path
    # fired (branch gamma_trigWindowFired). Data weight gamma_prescaleWeight = FullLumi / EffLumi
    # (year-averaged prescale; EffLumi in /fb from Additional_Docs/EGamma_trigger_paths.md, 2017).
    FullLumi: 41.54
    TriggerWindows:
        - [HLT_Photon50_R9Id90_HE10_IsoM,   55.0,  0.30]
        - [HLT_Photon75_R9Id90_HE10_IsoM,   82.5,  1.32]
        - [HLT_Photon90_R9Id90_HE10_IsoM,   99.0,  2.63]
        - [HLT_Photon120_R9Id90_HE10_IsoM, 135.0,  7.80]
        - [HLT_Photon165_R9Id90_HE10_IsoM, 181.5, 28.34]
        - [HLT_Photon200,                  230.0, 41.54]
